<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payload App</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0d0f17;
      --glass-bg: rgba(23, 27, 44, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #ffd700; /* Amarillo en Payload */
      --like-color: #00e676;
      --dislike-color: #ff5252;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    body.theme-plus {
      --primary: #1da1f2; /* Azul en Payload Plus */
      --glass-border: rgba(29, 161, 242, 0.2);
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      max-width: 650px;
      margin: 0 auto;
      padding: 20px 20px 80px 20px;
      background-color: var(--bg-color);
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .header-img {
      display: block;
      max-width: 220px;
      height: auto;
      margin: 10px auto 25px auto;
      filter: drop-shadow(0 4px 12px rgba(255, 215, 0, 0.2));
    }

    body.theme-plus .header-img {
      filter: drop-shadow(0 4px 12px rgba(29, 161, 242, 0.3));
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 20px;
      position: relative;
    }

    .pinned-badge {
      position: absolute;
      top: 15px;
      right: 15px;
      font-size: 1.2em;
    }

    textarea, input[type="text"], input[type="password"] {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 10px;
      box-sizing: border-box;
      color: var(--text-main);
      outline: none;
      margin-bottom: 10px;
    }

    textarea:focus, input:focus { border-color: var(--primary); }

    input[type="file"] { display: none; }

    .file-upload-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--glass-border);
      color: var(--text-main);
      font-size: 1.4em;
      cursor: pointer;
    }

    .btn-main {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 10px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    body.theme-plus .btn-main { color: #fff; }

    .btn-main:hover { transform: scale(1.03); }

    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .user-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--primary);
    }

    .username {
      font-weight: bold;
      color: var(--primary);
    }

    .crown { font-size: 0.9em; margin-left: 4px; }

    .actions { margin-top: 15px; display: flex; gap: 8px; flex-wrap: wrap; }

    .vote-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85em;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .vote-btn.like-active { color: var(--like-color); border-color: var(--like-color); }
    .vote-btn.dislike-active { color: var(--dislike-color); border-color: var(--dislike-color); }

    .replies-thread {
      margin-left: 12px;
      padding-left: 14px;
      border-left: 2px solid var(--glass-border);
      margin-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .reply-node { position: relative; }
    .reply-node::before {
      content: '';
      position: absolute;
      left: -14px;
      top: 20px;
      width: 10px;
      height: 2px;
      background: var(--glass-border);
    }

    .reply-form { margin-top: 15px; display: none; }

    /* NAVEGACIÓN INFERIOR (FOOTER MODOS) */
    .mode-nav {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid var(--glass-border);
      border-radius: 30px;
      padding: 6px;
      display: flex;
      gap: 8px;
      z-index: 100;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 18px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #000;
    }

    body.theme-plus .nav-btn.active { color: #fff; }
  </style>
</head>
<body>

  <img id="logoImg" src="payload.png" class="header-img">

  <!-- Panel Auth Payload Plus -->
  <div class="glass-panel" id="authPanel" style="display:none;">
    <div id="userInfo" style="display:none;">
      <span id="userGreeting"></span> 👑
      <button class="vote-btn" onclick="logout()" style="float:right;">Cerrar Sesión</button>
    </div>
    <form id="authForm">
      <h3 style="margin-top:0;">Payload Plus - Iniciar Sesión / Registrarse</h3>
      <input type="text" id="authUsername" placeholder="Usuario" required>
      <input type="password" id="authPassword" placeholder="Contraseña" required>
      <label for="authAvatar" style="font-size:0.8em; color:var(--text-muted);">Foto de Perfil (Opcional):</label><br>
      <input type="file" id="authAvatar" accept="image/*" style="display:block; margin-bottom:10px;">
      <button type="button" class="btn-main" onclick="handleAuth('login')">Ingresar</button>
      <button type="button" class="btn-main" onclick="handleAuth('register')" style="background:transparent; color:var(--text-main); border:1px solid var(--glass-border);">Registrarse</button>
    </form>
  </div>

  <!-- Formulario Publicar -->
  <div class="glass-panel">
    <form id="postForm">
      <textarea id="content" rows="3" placeholder="¿Qué estás pensando...?"></textarea>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="display:flex; align-items:center; gap:8px;">
          <label for="image" class="file-upload-btn">+</label>
          <input type="file" id="image" accept="image/*" onchange="document.getElementById('fileName').textContent = this.files[0]?.name || ''">
          <span id="fileName" style="font-size:0.8em; color:var(--text-muted);"></span>
        </div>
        <button type="submit" class="btn-main">Publicar</button>
      </div>
    </form>
  </div>

  <div id="feed"></div>

  <!-- Navegación Footer -->
  <div class="mode-nav">
    <button class="nav-btn active" id="btnPayload" onclick="switchMode('payload')">payload</button>
    <button class="nav-btn" id="btnPlus" onclick="switchMode('plus')">payload plus</button>
  </div>

  <script>
    const SECRET_ADMIN_KEY = 'soyunadminpoderosoXD@@##$$';
    let currentMode = 'payload';
    let currentUser = JSON.parse(localStorage.getItem('plus_user') || 'null');
    let allPosts = [];

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.setValueAtTime(type === 'vote' ? 500 : 350, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start(); osc.stop(audioCtx.currentTime + 0.1);
    }

    function getAnonTabId() {
      let id = sessionStorage.getItem('anon_tab_id');
      if (!id) {
        id = 'tab_' + Math.random().toString(36).substr(2, 9);
        sessionStorage.setItem('anon_tab_id', id);
      }
      return id;
    }
    const anonTabId = getAnonTabId();
    const isAdmin = () => sessionStorage.getItem('is_admin') === 'true';

    function switchMode(mode) {
      currentMode = mode;
      document.body.classList.toggle('theme-plus', mode === 'plus');
      document.getElementById('logoImg').src = mode === 'plus' ? 'payloadplus.png' : 'payload.png';
      document.getElementById('btnPayload').classList.toggle('active', mode === 'payload');
      document.getElementById('btnPlus').classList.toggle('active', mode === 'plus');
      document.getElementById('authPanel').style.display = mode === 'plus' ? 'block' : 'none';
      updateAuthUI();
      loadPosts();
    }

    function updateAuthUI() {
      if (currentUser && currentMode === 'plus') {
        document.getElementById('authForm').style.display = 'none';
        document.getElementById('userInfo').style.display = 'block';
        document.getElementById('userGreeting').innerHTML = `<img src="${currentUser.avatar_url || 'https://via.placeholder.com/30'}" class="user-avatar" style="vertical-align:middle;"> Hola, <b>${currentUser.username}</b>`;
      } else {
        document.getElementById('authForm').style.display = 'block';
        document.getElementById('userInfo').style.display = 'none';
      }
    }

    async function handleAuth(type) {
      const username = document.getElementById('authUsername').value;
      const password = document.getElementById('authPassword').value;
      const avatarFile = document.getElementById('authAvatar').files[0];

      if (!username || !password) return alert('Completa los campos');

      const formData = new FormData();
      formData.append('username', username);
      formData.append('password', password);
      if (avatarFile) formData.append('avatar', avatarFile);

      const endpoint = type === 'register' ? '/api/auth/register' : '/api/auth/login';
      const res = await fetch(endpoint, { method: 'POST', body: type === 'register' ? formData : JSON.stringify({ username, password }), headers: type === 'login' ? {'Content-Type': 'application/json'} : {} });
      const data = await res.json();

      if (res.ok) {
        currentUser = data;
        localStorage.setItem('plus_user', JSON.stringify(data));
        updateAuthUI();
      } else {
        alert(data.error);
      }
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('plus_user');
      updateAuthUI();
    }

    async function loadPosts() {
      const res = await fetch(`/api/posts?mode=${currentMode}`);
      allPosts = await res.json();
      renderFeed();
    }

    function renderFeed() {
      const parentPosts = allPosts.filter(p => !p.parent_id);
      document.getElementById('feed').innerHTML = parentPosts.map(post => renderPostHtml(post)).join('');
    }

    function renderPostHtml(post, isReply = false) {
      const replies = allPosts.filter(p => p.parent_id === post.id);
      const hasLiked = sessionStorage.getItem(`voted_like_${post.id}_${anonTabId}`) === 'true';
      const hasDisliked = sessionStorage.getItem(`voted_dislike_${post.id}_${anonTabId}`) === 'true';
      const author = post.profiles;

      return `
        <div class="glass-panel post ${isReply ? 'reply-node' : ''}" id="post-${post.id}">
          ${post.is_pinned ? `<span class="pinned-badge">📌</span>` : ''}
          ${author ? `
            <div class="post-header">
              <img src="${author.avatar_url || 'https://via.placeholder.com/36'}" class="user-avatar">
              <span class="username">${author.username}</span>
              <span class="crown">👑</span>
            </div>
          ` : ''}
          <p>${post.content || ''}</p>
          ${post.image_url ? `<img src="${post.image_url}" style="width:100%; border-radius:10px; margin-top:10px;" />` : ''}
          <div class="actions">
            <button class="vote-btn ${hasLiked ? 'like-active' : ''}" onclick="toggleVote('${post.id}', 'like')">👍 ${post.likes}</button>
            <button class="vote-btn ${hasDisliked ? 'dislike-active' : ''}" onclick="toggleVote('${post.id}', 'dislike')">👎 ${post.dislikes}</button>
            <button class="vote-btn" onclick="toggleReplyForm('${post.id}')">💬 (${replies.length})</button>
            ${isAdmin() ? `
              ${!post.parent_id ? `<button class="vote-btn" onclick="togglePin('${post.id}', ${!post.is_pinned})">📌</button>` : ''}
              <button class="vote-btn" style="color:var(--dislike-color);" onclick="deletePost('${post.id}')">🗑️ Borrar</button>
            ` : ''}
          </div>
          <div class="reply-form" id="reply-form-${post.id}">
            <textarea id="reply-input-${post.id}" rows="2" placeholder="Responder..."></textarea>
            <button class="btn-main" onclick="submitReply('${post.id}')" style="padding:4px 12px; font-size:0.8em;">Enviar</button>
          </div>
          ${replies.length > 0 ? `<div class="replies-thread">${replies.map(r => renderPostHtml(r, true)).join('')}</div>` : ''}
        </div>
      `;
    }

    document.getElementById('postForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const content = document.getElementById('content').value;

      if (content.trim() === SECRET_ADMIN_KEY) {
        sessionStorage.setItem('is_admin', 'true');
        alert('⚡ Modo Admin activado.');
        document.getElementById('content').value = '';
        renderFeed();
        return;
      }

      if (currentMode === 'plus' && !currentUser) return alert('Debes iniciar sesión en Payload Plus.');

      const formData = new FormData();
      formData.append('content', content);
      formData.append('mode', currentMode);
      if (currentUser) formData.append('author_id', currentUser.id);
      const file = document.getElementById('image').files[0];
      if (file) formData.append('image', file);

      await fetch('/api/posts', { method: 'POST', body: formData });
      playSound('post');
      document.getElementById('postForm').reset();
      document.getElementById('fileName').textContent = '';
    });

    async function toggleVote(id, type) {
      playSound('vote');
      const key = `voted_${type}_${id}_${anonTabId}`;
      const hasVoted = sessionStorage.getItem(key) === 'true';
      sessionStorage.setItem(key, !hasVoted);
      await fetch(`/api/posts/${id}/vote`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ type, action: hasVoted ? 'remove' : 'add' })
      });
    }

    async function deletePost(id) {
      if (!confirm('¿Borrar publicación?')) return;
      await fetch(`/api/posts/${id}`, { method: 'DELETE' });
    }

    async function togglePin(id, isPinned) {
      await fetch(`/api/posts/${id}/pin`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ is_pinned: isPinned })
      });
    }

    function toggleReplyForm(id) {
      const el = document.getElementById(`reply-form-${id}`);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    async function submitReply(parentId) {
      const content = document.getElementById(`reply-input-${parentId}`).value;
      if (!content) return;
      const formData = new FormData();
      formData.append('content', content);
      formData.append('parent_id', parentId);
      formData.append('mode', currentMode);
      if (currentUser) formData.append('author_id', currentUser.id);

      await fetch('/api/posts', { method: 'POST', body: formData });
      playSound('post');
    }

    async function initRealtime() {
      const configRes = await fetch('/api/config');
      const { supabaseUrl, supabaseKey } = await configRes.json();
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
      supabaseClient.channel('public:posts').on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => loadPosts()).subscribe();
    }

    loadPosts();
    initRealtime();
  </script>
</body>
</html>
