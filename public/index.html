<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitter Anónimo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-color: #0d0f17;
      --glass-bg: rgba(23, 27, 44, 0.65);
      --glass-border: rgba(255, 255, 255, 0.08);
      --primary: #1da1f2;
      --primary-hover: #0d8ddb;
      --like-color: #00e676;
      --dislike-color: #ff5252;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px;
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(at 0% 0%, rgba(29, 161, 242, 0.15) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.15) 0px, transparent 50%);
      background-attachment: fixed;
      color: var(--text-main);
    }

    .header-img {
      display: block;
      max-width: 220px;
      height: auto;
      margin: 10px auto 25px auto;
      filter: drop-shadow(0 4px 12px rgba(29, 161, 242, 0.3));
    }

    .glass-panel {
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      margin-bottom: 20px;
    }

    textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--glass-border);
      border-radius: 10px;
      padding: 12px;
      box-sizing: border-box;
      resize: vertical;
      color: var(--text-main);
      font-size: 0.95em;
      outline: none;
      transition: border 0.3s ease;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    input[type="file"] {
      color: var(--text-muted);
      font-size: 0.85em;
    }

    /* Botón principal animado */
    .btn-main {
      background: linear-gradient(135deg, #1da1f2, #7c3aed);
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 25px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 4px 15px rgba(29, 161, 242, 0.3);
    }

    .btn-main:hover {
      transform: translateY(-2px) scale(1.03);
      box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
    }

    .btn-main:active {
      transform: translateY(1px) scale(0.97);
    }

    .post {
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .post p {
      margin: 0 0 10px 0;
      line-height: 1.5;
      word-break: break-word;
    }

    .post img {
      max-width: 100%;
      border-radius: 12px;
      margin-top: 10px;
      border: 1px solid var(--glass-border);
    }

    .actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Botones de acción animados */
    .vote-btn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.88em;
      cursor: pointer;
      border: 1px solid var(--glass-border);
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: inline-flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }

    .vote-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      transform: scale(1.05);
    }

    .vote-btn:active {
      transform: scale(0.92);
    }

    /* Estados activos personalizados */
    .vote-btn.like-active {
      background: rgba(0, 230, 118, 0.15);
      color: var(--like-color);
      border-color: rgba(0, 230, 118, 0.4);
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.2);
    }

    .vote-btn.dislike-active {
      background: rgba(255, 82, 82, 0.15);
      color: var(--dislike-color);
      border-color: rgba(255, 82, 82, 0.4);
      box-shadow: 0 0 12px rgba(255, 82, 82, 0.2);
    }

    .vote-btn.reply-btn:hover {
      border-color: var(--primary);
      color: var(--primary);
    }

    .replies {
      margin-left: 15px;
      border-left: 2px solid rgba(255, 255, 255, 0.08);
      padding-left: 12px;
      margin-top: 15px;
    }

    .reply-form {
      margin-top: 15px;
      display: none;
      animation: fadeIn 0.3s ease-out;
    }
  </style>
</head>
<body>

  <img src="payload.png" alt="Logo" class="header-img">

  <div class="glass-panel">
    <form id="postForm">
      <textarea id="content" rows="3" placeholder="¿Qué estás pensando anónimamente...?"></textarea><br><br>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <input type="file" id="image" accept="image/*">
        <button type="submit" class="btn-main">Publicar</button>
      </div>
    </form>
  </div>

  <div id="feed"></div>

  <script>
    const form = document.getElementById('postForm');
    const feed = document.getElementById('feed');
    let allPosts = [];

    // Generar o recuperar un ID único local por dispositivo para aislar los likes por usuario
    function getAnonUserId() {
      let id = localStorage.getItem('anon_user_id');
      if (!id) {
        id = 'user_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('anon_user_id', id);
      }
      return id;
    }

    const anonUserId = getAnonUserId();

    function getVotedState(postId, type) {
      return localStorage.getItem(`voted_${type}_${postId}_${anonUserId}`) === 'true';
    }

    function setVotedState(postId, type, value) {
      if (value) {
        localStorage.setItem(`voted_${type}_${postId}_${anonUserId}`, 'true');
      } else {
        localStorage.removeItem(`voted_${type}_${postId}_${anonUserId}`);
      }
    }

    async function loadPosts() {
      const res = await fetch('/api/posts');
      allPosts = await res.json();
      renderFeed();
    }

    function renderFeed() {
      const parentPosts = allPosts.filter(p => !p.parent_id);
      feed.innerHTML = parentPosts.map(post => renderPostHtml(post)).join('');
    }

    function renderPostHtml(post) {
      const replies = allPosts.filter(p => p.parent_id === post.id);
      const hasLiked = getVotedState(post.id, 'like');
      const hasDisliked = getVotedState(post.id, 'dislike');

      return `
        <div class="glass-panel post" id="post-${post.id}">
          <p>${post.content || ''}</p>
          ${post.image_url ? `<img src="${post.image_url}" />` : ''}
          <div class="actions">
            <button class="vote-btn ${hasLiked ? 'like-active' : ''}" onclick="toggleVote('${post.id}', 'like')">
              👍 <span>${post.likes}</span>
            </button>
            <button class="vote-btn ${hasDisliked ? 'dislike-active' : ''}" onclick="toggleVote('${post.id}', 'dislike')">
              👎 <span>${post.dislikes}</span>
            </button>
            <button class="vote-btn reply-btn" onclick="toggleReplyForm('${post.id}')">
              💬 <span>Responder (${replies.length})</span>
            </button>
          </div>
          
          <div class="reply-form" id="reply-form-${post.id}">
            <textarea id="reply-input-${post.id}" rows="2" placeholder="Escribe tu respuesta anónima..."></textarea><br><br>
            <button class="btn-main" onclick="submitReply('${post.id}')" style="padding: 6px 16px; font-size: 0.85em;">Enviar</button>
          </div>

          ${replies.length > 0 ? `
            <div class="replies">
              ${replies.map(r => renderPostHtml(r)).join('')}
            </div>
          ` : ''}
        </div>
      `;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData();
      formData.append('content', document.getElementById('content').value);
      const imageFile = document.getElementById('image').files[0];
      if (imageFile) formData.append('image', imageFile);

      await fetch('/api/posts', { method: 'POST', body: formData });
      form.reset();
    });

    async function toggleVote(id, type) {
      const hasVoted = getVotedState(id, type);
      const action = hasVoted ? 'remove' : 'add';

      setVotedState(id, type, !hasVoted);
      renderFeed();

      await fetch(`/api/posts/${id}/vote`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, action })
      });
    }

    function toggleReplyForm(id) {
      const formDiv = document.getElementById(`reply-form-${id}`);
      formDiv.style.display = formDiv.style.display === 'block' ? 'none' : 'block';
    }

    async function submitReply(parentId) {
      const content = document.getElementById(`reply-input-${parentId}`).value;
      if (!content.trim()) return;

      const formData = new FormData();
      formData.append('content', content);
      formData.append('parent_id', parentId);

      await fetch('/api/posts', { method: 'POST', body: formData });
    }

    async function initRealtime() {
      const configRes = await fetch('/api/config');
      const { supabaseUrl, supabaseKey } = await configRes.json();
      
      const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

      supabaseClient
        .channel('public:posts')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'posts' }, () => {
          loadPosts();
        })
        .subscribe();
    }

    loadPosts();
    initRealtime();
  </script>
</body>
</html>
